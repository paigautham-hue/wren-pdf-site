name: Report a problem
description: Something in Wren PDF did not work as expected.
title: "Problem: "
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: "This report is public. Do not attach or paste confidential documents."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version (Help > About)
